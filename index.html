<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Productos para tu mejor amigo</title>

    <link href="https://jsdelivr.net" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .header-custom {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url('https://unsplash.com');
            color: white;
            padding: 80px 0;
            text-align: center;
        }

        /* Corrección visual para los mensajes de error dinámicos de la Semana 6 */
        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        
        .is-invalid ~ .invalid-feedback {
            display: block;
        }
    </style>
</head>

<body>

<header class="header-custom">
    <h1>🐶 PetShop</h1>
    <p>Productos para tu mejor amigo</p>
</header>

<div class="container my-5">

    <h2 class="text-success">Registro de productos</h2>

    <form id="formProducto" class="card p-3 shadow-sm" novalidate>
        <div class="mb-2">
            <input id="nombre" class="form-control" placeholder="Nombre del producto">
            <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres.</div>
        </div>
        
        <div class="mb-2">
            <input id="descripcion" class="form-control" placeholder="Descripción">
            <div class="invalid-feedback">La descripción debe tener al menos 10 caracteres.</div>
        </div>

        <div class="mb-2">
            <select id="categoria" class="form-control">
                <option value="">Seleccione categoría</option>
                <option value="Alimento">Alimento</option>
                <option value="Juguetes">Juguetes</option>
                <option value="Higiene">Higiene</option>
                <option value="Snacks">Snacks</option>
            </select>
            <div class="invalid-feedback">Por favor, seleccione una categoría.</div>
        </div>

        <button class="btn btn-success">Agregar producto</button>
    </form>

    <h4 class="mt-4">Total productos: <span id="contador">0</span></h4>

    <div id="listaProductos" class="row mt-3"></div>

</div>

<script src="script.js"></script>

</body>
</html>

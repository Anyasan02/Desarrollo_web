<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Productos para tu mejor amigo</title>

    <link href="https://jsdelivr.net" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .header-custom {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url('https://unsplash.com');
            color: white;
            padding: 80px 0;
            text-align: center;
        }

        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        
        .is-invalid ~ .invalid-feedback {
            display: block;
        }
    </style>
</head>

<body>

<!-- ======================================================================= -->
<!-- BLOQUE PLANTILLA FLASK: PROXIMAMENTE SE CONVERTIRÁ EN 'header.html'    -->
<!-- ======================================================================= -->
<header class="header-custom">
    <h1>🐶 PetShop</h1>
    <p>Productos para tu mejor amigo</p>
</header>
<!-- ======================================================================= -->

<!-- ======================================================================= -->
<!-- BLOQUE PLANTILLA FLASK: ESTA SECCIÓN FORMALIZARÁ EL 'base.html' (MAIN)  -->
<!-- ======================================================================= -->
<div class="container my-5">

    <h2 class="text-success">Registro de productos</h2>

    <!-- Formulario con Validaciones de la Semana 6 -->
    <form id="formProducto" class="card p-3 shadow-sm mb-4" novalidate>
        <div class="mb-2">
            <label class="form-label fw-bold">Nombre del Producto</label>
            <input id="nombre" class="form-control" placeholder="Nombre del producto">
            <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres.</div>
        </div>
        
        <div class="mb-2">
            <label class="form-label fw-bold">Descripción</label>
            <input id="descripcion" class="form-control" placeholder="Descripción">
            <div class="invalid-feedback">La descripción debe tener al menos 10 caracteres.</div>
        </div>

        <div class="mb-2">
            <label class="form-label fw-bold">Categoría</label>
            <select id="categoria" class="form-control">
                <option value="">Seleccione categoría</option>
                <option value="Alimento">Alimento</option>
                <option value="Juguetes">Juguetes</option>
                <option value="Higiene">Higiene</option>
                <option value="Snacks">Snacks</option>
            </select>
            <div class="invalid-feedback">Por favor, seleccione una categoría.</div>
        </div>

        <button class="btn btn-success w-100 fw-bold">Agregar producto</button>
    </form>

    <h4 class="mt-4 d-flex justify-content-between">
        <span>Catálogo de Productos Disponibles</span>
        <span class="badge bg-success">Total: <span id="contador">0</span></span>
    </h4>

    <!-- ======================================================================= -->
    <!-- CONTENIDO DINÁMICO: Renderizado desde Arreglos de JavaScript (Semana 7)  -->
    <!-- ======================================================================= -->
    <div id="listaProductos" class="row mt-3">
        <!-- JS inyectará las tarjetas o el mensaje de alerta condicional aquí -->
    </div>
    <!-- ======================================================================= -->

</div>
<!-- ======================================================================= -->

<!-- ======================================================================= -->
<!-- BLOQUE PLANTILLA FLASK: PROXIMAMENTE SE CONVERTIRÁ EN 'footer.html'    -->
<!-- ======================================================================= -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 PetShop - Todos los derechos reservados</p>
</footer>
<!-- ======================================================================= -->

<script src="script.js"></script>

</body>
</html>

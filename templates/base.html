<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Mundo Mascota
        {% endblock %}
    </title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<!-- MENU -->

<nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
            🐾 Mundo Mascota
        </a>


        <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu">

        <span class="navbar-toggler-icon"></span>

        </button>



        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">
                    <a class="nav-link text-white"
                    href="{{ url_for('index') }}">
                    Inicio
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link text-white"
                    href="{{ url_for('productos') }}">
                    Productos
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link text-white"
                    href="{{ url_for('clientes') }}">
                    Clientes
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link text-white"
                    href="{{ url_for('proveedores') }}">
                    Proveedores
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link text-white"
                    href="{{ url_for('facturacion') }}">
                    Facturación
                    </a>
                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- CONTENIDO DE CADA PAGINA -->

<main>

{% block content %}

{% endblock %}

</main>



<!-- FOOTER -->

<footer class="bg-success text-white text-center p-4 mt-5">

    <h5>🐾 Mundo Mascota</h5>

    <p>
    Cuidamos a tus mascotas con amor y productos de calidad.
    </p>

    <small>
    
    </small>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- JavaScript propio -->

<script src="{{ url_for('static', filename='js/script.js') }}"></script>


</body>

</html>
